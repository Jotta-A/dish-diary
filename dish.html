<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dish Diary</title>
    <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin="">
    <link rel="stylesheet" href="assets/styles/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
    <section class="colunas">
        <article class="container">
        <!-- Primeira Linha: Três Colunas com Largura Automática -->
            <article class="row">
                <div class="col text-bg-info">
                    <div class="col">
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
                            Abrir Modal
                        </button>
                        <article class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="exampleModalLabel">Título do Modal</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        Este é o conteúdo do modal.
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                                    </div>
                                </div>
                            </div>
                        </article>
                    </div>
                </div>
                <div class="col text-bg-danger">
                    <div class="col">
                        <div class="card custom-card">
                            <img src="https://placehold.co/150x100" class="card-img-top img-fluid" alt="Imagem">
                            <div class="card-body">
                                <h5 class="card-title text-uppercase text-primary fw-bold">Título do Card</h5>
                                <p class="card-text fs-5">Este é um exemplo de texto no corpo do card.</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col d-none d-md-block text-bg-warning">Terceira Coluna (Oculta em XS e SM)
                    <div class="d-flex justify-content-between">
                        <button class="btn btn-success">Botão 1</button>
                        <button class="btn btn-danger">Botão 2</button>
                        <button class="btn btn-warning">Botão 3</button>
                        <button class="btn btn-info">Botão 4</button>
                        <button class="btn btn-dark">Botão 5</button>
                    </div>
                </div>
            </article>
            <!-- Segunda Linha: Coluna Única -->
            <article class="row">
                <div class="col-12 text-bg-secondary">
                    <i class="bi bi-alarm"></i>
                    <i class="bi bi-bell"></i>
                    <i class="bi bi-calendar"></i>
                </div>
            </article>

            <!-- Terceira Linha: Tamanhos Fixos, Offset e Order -->
            <article class="row">
                <!-- Coluna com offset -->
                <div class="col-md-4 offset-md-2 text-bg-info">Coluna com Offset</div>
                <!-- Coluna com ordem personalizada -->
                <div class="col-md-4 order-md-3 text-bg-danger">Coluna com Ordem 3</div>
                <!-- Coluna padrão -->
                <div class="col-md-4 order-md-1 text-bg-warning">Coluna com Ordem 1</div>
            </article>
        </article>
    </sec   tion>

    <section>

    </section>

    <section class="card">
        <div class="col">
            <div class="card">
                <img src="https://placehold.co/150x100" class="card-img-top img-fluid" alt="Imagem">
                <div class="card-body">
                    <h5 class="card-title">Título do Card</h5>
                    <p class="card-text">Este é um exemplo de texto no corpo do card.</p>
                </div>
            </div>
        </div>
    </section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
