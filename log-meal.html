<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>The Editorial Gourmand - Log Meal</title>
    <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin="">
    <!-- Bootstrap 5.3 CSS -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/styles/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="min-vh-100 d-flex align-items-center justify-content-center p-3 p-sm-4 bg-backdrop">
    <!-- Modal Container -->
    <div class="bg-surface w-100 modal-container rounded overflow-hidden d-flex flex-column">
        <!-- Header -->
        <header
            class="d-flex align-items-center justify-content-between px-4 py-4 border-bottom border-custom bg-header-footer">
            <h1 class="text-main fs-3 fw-bold m-0" style="letter-spacing: -0.025em;">Log a Meal</h1>
            <button aria-label="Close modal" onclick="history.back()" class="btn btn-link p-0 text-muted-custom text-decoration-none">
                <i class="bi bi-x-lg" style="font-size: 1.75rem;"></i>
            </button>
        </header>
        <!-- Scrollable Content Area -->
        <div class="flex-grow-1 overflow-auto p-4 p-md-5 bg-surface d-flex flex-column gap-5">
            <!-- Dish Search / Name -->
            <div>
                <label class="d-block font-ui fs-6 fw-semibold text-uppercase text-main mb-2" for="dish-name"
                    style="letter-spacing: 0.05em;">What did you eat?</label>
                <input class="w-100 input-dish font-display text-main" id="dish-name"
                    placeholder="e.g., Truffle Gnocchi at Le Bernardin" type="text" />
            </div>
            <!-- Photo Upload Dropzone -->
            <div>
                <label class="d-block font-ui fs-6 fw-semibold text-uppercase text-main mb-2"
                    style="letter-spacing: 0.05em;">The Visuals</label>
                <div class="w-100 rounded d-flex flex-column align-items-center justify-content-center dropzone">
                    <i class="bi bi-camera fs-1 text-muted-custom mb-3"
                        style="transition: color 0.3s;"></i>
                    <p class="font-ui text-main fw-medium m-0" style="font-size: 0.875rem;">Drag &amp; drop a
                        high-resolution photo</p>
                    <p class="font-ui text-muted-custom mt-1 mb-0" style="font-size: 0.75rem;">or click to browse</p>
                </div>
            </div>
            <!-- Rating Component -->
            <div>
                <label class="d-block font-ui fs-6 fw-semibold text-uppercase text-main mb-3"
                    style="letter-spacing: 0.05em;">Your Rating</label>
                <input type="hidden" id="rating-value" name="rating" value="0" />
                <div class="d-flex align-items-center gap-1" id="star-rating-widget" role="group" aria-label="Star rating">
                    <!-- 5 stars, each split into left-half and right-half hitboxes -->
                    <div class="star-unit position-relative" data-index="1">
                        <i class="bi bi-star star-icon" data-index="1" style="font-size: 2.5rem; color: var(--outline); transition: color 0.15s;"></i>
                        <button class="star-half-btn left-half" data-value="0.5" aria-label="0.5 stars" title="0.5"></button>
                        <button class="star-half-btn right-half" data-value="1" aria-label="1 star" title="1"></button>
                    </div>
                    <div class="star-unit position-relative" data-index="2">
                        <i class="bi bi-star star-icon" data-index="2" style="font-size: 2.5rem; color: var(--outline); transition: color 0.15s;"></i>
                        <button class="star-half-btn left-half" data-value="1.5" aria-label="1.5 stars" title="1.5"></button>
                        <button class="star-half-btn right-half" data-value="2" aria-label="2 stars" title="2"></button>
                    </div>
                    <div class="star-unit position-relative" data-index="3">
                        <i class="bi bi-star star-icon" data-index="3" style="font-size: 2.5rem; color: var(--outline); transition: color 0.15s;"></i>
                        <button class="star-half-btn left-half" data-value="2.5" aria-label="2.5 stars" title="2.5"></button>
                        <button class="star-half-btn right-half" data-value="3" aria-label="3 stars" title="3"></button>
                    </div>
                    <div class="star-unit position-relative" data-index="4">
                        <i class="bi bi-star star-icon" data-index="4" style="font-size: 2.5rem; color: var(--outline); transition: color 0.15s;"></i>
                        <button class="star-half-btn left-half" data-value="3.5" aria-label="3.5 stars" title="3.5"></button>
                        <button class="star-half-btn right-half" data-value="4" aria-label="4 stars" title="4"></button>
                    </div>
                    <div class="star-unit position-relative" data-index="5">
                        <i class="bi bi-star star-icon" data-index="5" style="font-size: 2.5rem; color: var(--outline); transition: color 0.15s;"></i>
                        <button class="star-half-btn left-half" data-value="4.5" aria-label="4.5 stars" title="4.5"></button>
                        <button class="star-half-btn right-half" data-value="5" aria-label="5 stars" title="5"></button>
                    </div>
                    <span id="rating-label" class="ms-3 font-ui fw-bold" style="font-size: 1rem; color: var(--primary); min-width: 4rem;">— / 5</span>
                </div>
            </div>
            <!-- Date Selector -->
            <div style="max-width: 20rem;">
                <label class="d-block font-ui fs-6 fw-semibold text-uppercase text-main mb-2"
                    style="letter-spacing: 0.05em;">Date</label>
                <div class="position-relative">
                    <input class="w-100 input-custom py-2 ps-3 pe-5 fs-5 font-display text-main" type="text"
                        value="Today" />
                    <i class="bi bi-calendar position-absolute text-muted-custom"
                        style="right: 0.75rem; top: 50%; transform: translateY(-50%);"></i>
                </div>
            </div>
            <!-- Editorial Review Textarea -->
            <div>
                <label class="d-block font-ui fs-6 fw-semibold text-uppercase text-main mb-2" for="review-body"
                    style="letter-spacing: 0.05em;">The Verdict</label>
                <textarea class="w-100 input-custom p-3 fs-5 font-display text-main" id="review-body"
                    placeholder="Describe the plating, the complex flavors, the ambiance..." rows="6"
                    style="line-height: 1.625; resize: vertical;"></textarea>
            </div>
        </div>
        <!-- Footer / Actions -->
        <footer
            class="d-flex align-items-center justify-content-end gap-3 px-4 py-3 border-top border-custom bg-header-footer">
            <button onclick="history.back()" class="btn btn-link btn-cancel font-ui fw-bold text-uppercase text-decoration-none px-3 py-2"
                style="font-size: 0.875rem; letter-spacing: 0.1em;">Cancel</button>
            <a href="home.html" class="btn bg-primary-custom border-0 font-ui fw-bold text-uppercase px-4 py-2 rounded shadow-sm text-decoration-none"
                style="font-size: 0.875rem; letter-spacing: 0.1em;">Publish</a>
        </footer>
    </div>
    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    (function () {
        const widget = document.getElementById('star-rating-widget');
        const hiddenInput = document.getElementById('rating-value');
        const label = document.getElementById('rating-label');
        const icons = widget.querySelectorAll('.star-icon');
        let selectedValue = 0;

        function renderStars(value) {
            icons.forEach((icon, i) => {
                const starPos = i + 1; // 1-based
                if (value >= starPos) {
                    // full star
                    icon.className = 'bi bi-star-fill star-icon';
                    icon.style.color = 'var(--primary)';
                } else if (value >= starPos - 0.5) {
                    // half star
                    icon.className = 'bi bi-star-half star-icon';
                    icon.style.color = 'var(--primary)';
                } else {
                    // empty star
                    icon.className = 'bi bi-star star-icon';
                    icon.style.color = 'var(--outline)';
                }
            });
        }

        widget.querySelectorAll('.star-half-btn').forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                renderStars(parseFloat(btn.dataset.value));
            });
            btn.addEventListener('click', () => {
                selectedValue = parseFloat(btn.dataset.value);
                hiddenInput.value = selectedValue;
                label.textContent = selectedValue + ' / 5';
                renderStars(selectedValue);
            });
        });

        widget.addEventListener('mouseleave', () => {
            renderStars(selectedValue);
        });
    })();
    </script>
</body>

</html>
